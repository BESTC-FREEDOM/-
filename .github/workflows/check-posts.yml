name: 초안 검수
on:
  push:
    paths: ["posts/drafts/**.md"]
  pull_request:
    paths: ["posts/drafts/**.md"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_post.py posts/drafts/*.md || true
